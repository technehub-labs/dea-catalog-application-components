change_history:
  - version: "1.0"
    date: 2026-10-18
    cr: CR-IS-CAT-02D
    note: "Cross-catalogue relationship registry after P2 follow-on. 22 relationship records across 8 integration domains. The P1 population (from 02C) provides the source records; the relationship kinds are anchored in the metamodel (CR-017..021) or OpenDEAM (CR-AR-FMWK-04). The measured_by kind is an OpenDEAM allocation declaration, NOT a metamodel relationship claim (per G-11). The 02C P2/P3 follow-on populations will further extend the registry."
