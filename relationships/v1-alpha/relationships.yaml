    status: active
    cr: CR-IS-CAT-02D
    note: "The API Gateway is measured by the p99 latency metric. This is an OpenDEAM v0.7.0 allocation declaration; the metric definition remains owned by the Metric catalogue (per G-11)."

  # ISC consumes DataEntity
