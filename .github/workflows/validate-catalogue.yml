name: validate-catalogue

# CR-IS-CAT-02D (2026-10-18). Validates the Information System Component
# catalogue's cross-catalogue integration and conformance.
# 14 validation steps covering the 4 conformance levels (structural,
# semantic, cross-catalogue, governance) per the source doc section 7.
#
# Governance: G-08 (every relationship uses an authorized semantic
# contract), G-09 (completeness is evidenced, not assumed), G-10 (all
# generated artefacts must be reproducible and validated), G-11 (metric
# definitions remain owned by the Metric catalogue).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: "Step 1: YAML/JSON parse"
        run: |
          python3 - <<'EOF'
          import yaml, json, sys
          ok = True
          try:
            with open('relationships/v1-alpha/relationships.yaml') as f:
              yaml.safe_load(f)
            print('OK: relationships/v1-alpha/relationships.yaml')
          except Exception as e:
            print(f'FAIL: {e}')
            ok = False
          try:
            with open('schemas/relationships/relationship-record.schema.json') as f:
              json.load(f)
            print('OK: schemas/relationships/relationship-record.schema.json')
          except Exception as e:
            print(f'FAIL: {e}')
            ok = False
          sys.exit(0 if ok else 1)
          EOF
      - name: "Step 2: Relationship-type authorization check"
        run: |
          python3 - <<'EOF'
          import yaml, sys
          valid_kinds = {'executes', 'provides', 'depends-on', 'hosts',
                         'consumes', 'produces', 'exposes', 'measured_by'}
          with open('relationships/v1-alpha/relationships.yaml') as f:
            rels = yaml.safe_load(f)['relationships']
          ok = True
          for r in rels:
            if r['relationship'] not in valid_kinds:
              print(f'FAIL: {r["id"]} relationship={r["relationship"]} not in {valid_kinds}')
              ok = False
          print(f'Step 2 (relationship-type authorization): {"PASS" if ok else "FAIL"} ({len(rels)} records)')
          sys.exit(0 if ok else 1)
          EOF
      - name: "Step 3: Cross-reference resolution (relationship endpoints)"
        run: |
          python3 - <<'EOF'
          import yaml, glob, sys
          with open('relationships/v1-alpha/relationships.yaml') as f:
            rels = yaml.safe_load(f)['relationships']
          # Build the set of canonical ISC entity ids from this catalog
          isc_ids = set()
          for f in glob.glob('entities/v1-alpha/components/**/component.yaml', recursive=True):
            with open(f) as fp:
              d = yaml.safe_load(fp)
            isc_ids.add(d['id'])
          # Valid prefixes for cross-catalog targets
          valid_prefixes = (
            'dea:information-system-component-',
            'dea:information-system-function-',
            'dea:information-system-service-',
            'dea:integration-interface-',
            'dea:data-entity-',
            'dea:event-',
            'dea:metric-',
            'dea:business-capability-',
            'dea:business-process-',
          )
          ok = True
          for r in rels:
            src = r['source_id']
            tgt = r['target_id']
            # The source must have a canonical prefix
            if not any(src.startswith(p) for p in valid_prefixes):
              print(f'FAIL: {r["id"]} source {src} has non-canonical prefix')
              ok = False
            # The target must have a canonical prefix
            if not any(tgt.startswith(p) for p in valid_prefixes):
              print(f'FAIL: {r["id"]} target {tgt} has non-canonical prefix')
              ok = False
            # ISC sources must exist in this catalog
            if src.startswith('dea:information-system-component-') and src not in isc_ids:
              print(f'FAIL: {r["id"]} ISC source {src} not in this catalog')
              ok = False
          print(f'Step 3 (cross-reference resolution): {"PASS" if ok else "FAIL"}')
          sys.exit(0 if ok else 1)
          EOF
      - name: "Step 4: OpenDEAM allocation declaration check (measured_by)"
        run: |
          python3 - <<'EOF'
          import yaml, sys
          with open('relationships/v1-alpha/relationships.yaml') as f:
            rels = yaml.safe_load(f)['relationships']
          ok = True
          for r in rels:
            if r['relationship'] == 'measured_by':
              # The target must be a metric (per OpenDEAM v0.7.0 allocation)
              if not r['target_id'].startswith('dea:metric-'):
                print(f'FAIL: {r["id"]} measured_by target {r["target_id"]} is not a metric')
                ok = False
              else:
                print(f'OK: {r["id"]} measured_by {r["target_id"]} is a metric (per OpenDEAM v0.7.0)')
          print(f'Step 4 (OpenDEAM allocation): {"PASS" if ok else "FAIL"}')
          sys.exit(0 if ok else 1)
          EOF
      - name: "Step 5-9: Generate conformance reports"
        run: |
          python3 scripts/generate_conformance_reports.py
      - name: "Step 10: Schema validation (relationship-record.schema.json)"
        run: |
          python3 - <<'EOF'
          import yaml, json, jsonschema, sys
          with open('schemas/relationships/relationship-record.schema.json') as f:
            schema = json.load(f)
          with open('relationships/v1-alpha/relationships.yaml') as f:
            rels = yaml.safe_load(f)['relationships']
          ok = True
          for r in rels:
            try:
              jsonschema.validate(r, schema)
            except jsonschema.ValidationError as e:
              print(f'FAIL: {r["id"]}: {e.message}')
              ok = False
          print(f'Step 10 (schema validation): {"PASS" if ok else "FAIL"} ({len(rels)} records)')
          sys.exit(0 if ok else 1)
          EOF
      - name: "Step 11: Idempotency check (re-run produces same reports)"
        run: |
          python3 scripts/generate_conformance_reports.py > /tmp/second_run.log
          # Compare report hashes
          python3 - <<'EOF'
          import hashlib, pathlib, sys
          ok = True
          for f in ['catalogue-conformance.yaml', 'relationship-coverage.yaml',
                    'reference-integrity.yaml', 'taxonomy-coverage.yaml',
                    'documentation-coverage.yaml']:
            p = pathlib.Path(f'reports/{f}')
            if not p.exists():
              print(f'FAIL: {p} does not exist')
              ok = False
              continue
            h = hashlib.sha256(p.read_bytes()).hexdigest()
            print(f'OK: {f} sha256={h[:16]}')
          sys.exit(0 if ok else 1)
          EOF
      - name: "Step 12: Composition edge validation (rule 5 from 02B)"
        run: |
          python3 - <<'EOF'
          import yaml, glob, sys
          valid_kinds = {'contains', 'depends-on', 'hosts', 'orchestrates'}
          ok = True
          files = glob.glob('entities/v1-alpha/components/**/component.yaml', recursive=True)
          for f in files:
            with open(f) as fp:
              d = yaml.safe_load(fp)
            for e in d.get('composition', []):
              if e['kind'] not in valid_kinds:
                print(f'FAIL (rule 5): {f} composition kind={e["kind"]} not in {valid_kinds}')
                ok = False
          print(f'Step 12 (composition edge validation): {"PASS" if ok else "FAIL"}')
          sys.exit(0 if ok else 1)
          EOF
      - name: "Step 13: README template conformance (19 sections from 02B)"
        run: |
          python3 - <<'EOF'
          import glob, sys
          ok = True
          files = glob.glob('entities/v1-alpha/components/**/README.md', recursive=True)
          for f in files:
            with open(f) as fp:
              content = fp.read()
            n_sections = sum(1 for i in range(1, 20) if f'# {i}.' in content or f'#{i}.' in content)
            if n_sections < 19:
              print(f'FAIL: {f} has {n_sections}/19 sections')
              ok = False
          print(f'Step 13 (README template conformance): {"PASS" if ok else "FAIL"} ({len(files)} READMEs)')
          sys.exit(0 if ok else 1)
          EOF
      - name: "Step 14: Cardinality validation (per source doc section 4 matrix)"
        run: |
          python3 - <<'EOF'
          import yaml, sys
          valid_cardinalities = {'one', 'many'}
          with open('relationships/v1-alpha/relationships.yaml') as f:
            rels = yaml.safe_load(f)['relationships']
          ok = True
          for r in rels:
            card = r.get('cardinality')
            if card not in valid_cardinalities:
              print(f'FAIL: {r["id"]} cardinality={card} not in {valid_cardinalities}')
              ok = False
          print(f'Step 14 (cardinality validation): {"PASS" if ok else "FAIL"} ({len(rels)} records)')
          sys.exit(0 if ok else 1)
          EOF
