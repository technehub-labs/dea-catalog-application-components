# Catalog-level index :  Information System Component v1-alpha
# CR-IS-CAT-02C (2026-10-18). The catalog-level index aggregates the
# component-domain-level indexes. Per CR-IS-CAT-02A, the catalog-level
# index MUST list the registered component domains and the count of
# component records per domain.

version: 1
effective: 2026-10-18
cr: CR-IS-CAT-02C
parent_cr: CR-IS-CAT-02
cr_02a: CR-IS-CAT-02A
cr_02b: CR-IS-CAT-02B

catalog: dea-catalog-information-system-components
catalog_status: rename-pending-org-admin-transfer

# The list of component domains registered in taxonomy/component-domains.yaml.
# Each entry records the count of component records under that domain.
domains:
  - id: iscc:domain:customer-experience
    code: ISCC-01
    name: Customer Experience
    path: components/customer-experience/
    status: active
    component_count: 4
  - id: iscc:domain:core-operations
    code: ISCC-04
    name: Core Operations
    path: components/core-operations/
    status: active
    component_count: 3
  - id: iscc:domain:data-and-analytics
    code: ISCC-05
    name: Data and Analytics
    path: components/data-and-analytics/
    status: active
    component_count: 4
  - id: iscc:domain:integration
    code: ISCC-06
    name: Integration
    path: components/integration/
    status: active
    component_count: 4
  - id: iscc:domain:security
    code: ISCC-07
    name: Security
    path: components/security/
    status: active
    component_count: 3

  - id: iscc:domain:employee-experience
    code: ISCC-02
    name: Employee Experience
    path: components/employee-experience/
    status: active
    component_count: 3
  - id: iscc:domain:partner-integration
    code: ISCC-03
    name: Partner Integration
    path: components/partner-integration/
    status: active
    component_count: 4
  - id: iscc:domain:observability
    code: ISCC-08
    name: Observability
    path: components/observability/
    status: active
    component_count: 4

# Catalog-level counts
total_components: 30
f_level_distribution:
  F0: 0
  F1: 0
  F2: 8
  F3: 0
  F4: 22
  F5: 0

# Change history
change_history:
  - version: "1.0"
    date: 2026-10-18
    cr: CR-IS-CAT-02C
    note: "Initial catalog-level index after the P1 population. 5 component domains registered; 18 component records (5 F2 + 13 F4). The P2/P3 follow-on populations will further extend the catalog."
  - version: "1.1"
    date: 2026-10-18
    cr: CR-IS-CAT-02C-P2
    note: "P2 follow-on population. 3 component domains added (ISCC-02, ISCC-03, ISCC-08); 11 new component records (3 F2 + 8 F4). Total catalog: 30 records (8 F2 + 22 F4) across 8 of 10 domains."
