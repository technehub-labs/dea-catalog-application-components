# Classification rules :  Information System Component
# CR-IS-CAT-02A (2026-10-18). The 11 classification rules that govern how
# components are classified under the component-domain taxonomy and the
# orthogonal classification facets.
#
# Governance:
# - G-05: taxonomy nodes are catalogue classifications, not metamodel entities.
# - G-06: classification (this file) and component decomposition (02B) are
#   separate structures.
# - G-09: catalogue completeness must be evidenced, not assumed.

version: 1
effective: 2026-10-18
cr: CR-IS-CAT-02A
parent_cr: CR-IS-CAT-02

rules:
  - id: iscc:rule:classification-01
    code: rule-01
    name: "Primary domain assignment"
    type: rule
    status: active
    version: "1.0"
    effective_date: "2026-10-18"
    definition: "Every active component MUST have exactly one primary component-domain assignment."
    rationale: "A primary assignment supports catalogue navigation; multiple primary assignments break MECE presentation."
    enforceable: true
    validation: "Each active component record MUST reference exactly one component-domain identifier from taxonomy/component-domains.yaml."

  - id: iscc:rule:classification-02
    code: rule-02
    name: "Additional domain associations"
    type: rule
    status: active
    version: "1.0"
    effective_date: "2026-10-18"
    definition: "Additional domain associations MUST be explicitly justified."
    rationale: "Multi-domain membership is permitted (principle 2.4) but requires justification so that the rationale is discoverable."
    enforceable: true
    validation: "Each component record with more than one component-domain identifier MUST include a non-empty 'additional_domain_rationale' field per additional domain."

  - id: iscc:rule:classification-03
    code: rule-03
    name: "Purpose-based classification"
    definition: "Classification MUST be based on the component's purpose."
    rationale: "Components are classified by what they do, not by where they are deployed or who owns them."
    enforceable: true
    validation: "The component's 'primary_purpose' field MUST match the assigned domain's scope and inclusion criteria."
    type: rule
    status: active
    version: "1.0"
    effective_date: "2026-10-18"

  - id: iscc:rule:classification-04
    code: rule-04
    name: "Implementation technology is not classification"
    definition: "Implementation technology MUST NOT determine component identity."
    rationale: "A web application component remains a customer-experience component whether implemented in Java, Python, Node.js or Go. Implementation technology is captured through the orthogonal facet 'execution characteristics' (5.3)."
    enforceable: true
    validation: "The 'execution_characteristics' orthogonal facet MUST NOT duplicate the primary domain assignment."
    type: rule
    status: active
    version: "1.0"
    effective_date: "2026-10-18"

  - id: iscc:rule:classification-05
    code: rule-05
    name: "Application ownership is not classification"
    definition: "Application ownership MUST NOT determine component classification."
    rationale: "An application may own multiple components across multiple domains; application ownership is captured in the component-to-application relationship, not in the taxonomy."
    enforceable: true
    validation: "The component record MUST NOT have an 'application_owner' field; the component-to-application relationship (in 02D) carries that information."
    type: rule
    status: active
    version: "1.0"
    effective_date: "2026-10-18"

  - id: iscc:rule:classification-06
    code: rule-06
    name: "No application-system misclassification"
    definition: "A component MUST NOT be classified as an application system."
    rationale: "Components and application systems are distinct. A component is a deployable unit; an application system is a composite of one or more components. The relationship is recorded in the metamodel, not in the taxonomy."
    enforceable: true
    validation: "The 'type' field of any record in entities/v1-alpha/components/ MUST be 'InformationSystemComponent' (or a concrete specialization like 'ApplicationComponent' or 'IntegrationComponent'); it MUST NOT be 'ApplicationSystem'."
    type: rule
    status: active
    version: "1.0"
    effective_date: "2026-10-18"

  - id: iscc:rule:classification-07
    code: rule-07
    name: "Taxonomy nodes are not metamodel entities"
    definition: "Classification nodes MUST NOT be registered as metamodel entities."
    rationale: "Per G-05, taxonomy nodes are catalogue classifications. They live in this taxonomy/, not in the metamodel."
    enforceable: true
    validation: "The taxonomy identifier namespace ('iscc:domain:*', 'iscc:category:*', 'iscc:facet:*') MUST be disjoint from the metamodel entity namespace ('dea:*')."
    type: rule
    status: active
    version: "1.0"
    effective_date: "2026-10-18"

  - id: iscc:rule:classification-08
    code: rule-08
    name: "Deprecated taxonomy values remain traceable"
    definition: "Deprecated taxonomy values MUST remain traceable."
    rationale: "A component classified under a now-deprecated domain MUST continue to be discoverable; deprecation does not delete."
    enforceable: true
    validation: "A taxonomy record with 'status: deprecated' MUST retain its 'id' field; the deprecation is a status change, not a deletion."
    type: rule
    status: active
    version: "1.0"
    effective_date: "2026-10-18"

  - id: iscc:rule:classification-09
    code: rule-09
    name: "No self-ancestor"
    definition: "No taxonomy node may have itself as an ancestor."
    rationale: "Self-ancestor is a degenerate cycle."
    enforceable: true
    validation: "The 'parent' field of a taxonomy record MUST NOT equal the record's own 'id'."
    type: rule
    status: active
    version: "1.0"
    effective_date: "2026-10-18"

  - id: iscc:rule:classification-10
    code: rule-10
    name: "No circular hierarchies"
    definition: "Circular taxonomy hierarchies MUST be rejected."
    rationale: "The classification hierarchy is a tree; cycles break the tree structure."
    enforceable: true
    validation: "The validator walks the parent chain from each node; if a node is encountered twice during the walk, the hierarchy is rejected."
    type: rule
    status: active
    version: "1.0"
    effective_date: "2026-10-18"

  - id: iscc:rule:classification-11
    code: rule-11
    name: "Registered taxonomy references"
    definition: "Classification assignments MUST reference registered taxonomy identifiers."
    rationale: "A component may only be classified under a taxonomy identifier that exists in taxonomy/component-domains.yaml."
    enforceable: true
    validation: "Each component-domain identifier in a component record MUST exist in the taxonomy/component-domains.yaml registry."
    type: rule
    status: active
    version: "1.0"
    effective_date: "2026-10-18"

change_history:
  - version: "1.0"
    date: 2026-10-18
    cr: CR-IS-CAT-02A
    note: "Initial set of 11 classification rules. Source: 5-CR programme template (rules 1-11). All rules are enforceable via the validate-taxonomy.yml workflow."
